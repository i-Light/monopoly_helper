name: monopoly_helper
description: "A professional modular Flutter companion and mini-game suite for Monopoly with banking, dice roller, chance cards, and 14 interactive mini-games."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: '>=6.0.0 <7.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=3.0.0 <6.0.0'

flutter:
  uses-material-design: true

  assets:
    - assets/data/
